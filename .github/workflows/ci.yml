# Implements: ci/ci-runs-everything, ci/end-to-end
name: ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: make lint
      - run: make test
      - run: make spec-check
