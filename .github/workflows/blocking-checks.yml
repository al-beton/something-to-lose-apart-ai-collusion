# Implements: ci/checks-on-every-pr, ci/one-gate, ci/report-comment
name: blocking-checks

# The one status to require before merging. Add jobs below and list each in the
# gate's needs.
on:
  pull_request:
    # edited: re-check the title and description (pr-gate) when they change.
    # No branch filter, so stacked pull requests are checked too.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Title and closing block (contributing/spec/pull-requests.md).
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            product/spec
            experiments/spec
            contributing/spec
          persist-credentials: false
      - run: python3 .github/scripts/pr_gate.py

  # One free game, its report attached and summed up in a comment
  # (contributing/spec/ci.md). Only posting the comment may fail quietly.
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: uv run lab run configs/pr-game.yaml --out runs/pr --cache off -y
      - run: uv run lab report runs/pr --out runs/pr/report.html
      - run: >-
          uv run python -c "from collusion_lab.report.markdown import
          first_screen_markdown as f; print(f('runs/pr'))" > runs/pr/first-screen.md
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: runs/pr/report.html
      - run: python3 .github/scripts/report_comment.py runs/pr/first-screen.md
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}

  blocking-checks:
    runs-on: ubuntu-latest
    needs: [ci, pr-gate, report]
    if: always()
    permissions: {}
    steps:
      - name: All required checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if ! jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"; then
            echo "A required check failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All required checks passed."
