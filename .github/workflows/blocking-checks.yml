# Implements: ci/checks-on-every-pr, ci/one-gate, ci/smoke-evidence
name: blocking-checks

# The one status to require before merging. Add jobs below and list each in the
# gate's needs.
on:
  pull_request:
    # edited: re-check the title and description (pr-gate) when they change.
    # No branch filter, so stacked pull requests are checked too.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Title and closing block (contributing/spec/pull-requests.md).
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            product/spec
            experiments/spec
            contributing/spec
          persist-credentials: false
      - run: python3 .github/scripts/pr_gate.py

  # A free mock run, its summary posted on the pull request (contributing/spec/ci.md).
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: make smoke
      - run: python3 .github/scripts/smoke_comment.py runs/smoke/summary.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  blocking-checks:
    runs-on: ubuntu-latest
    needs: [ci, pr-gate, smoke]
    if: always()
    permissions: {}
    steps:
      - name: All required checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if ! jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"; then
            echo "A required check failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All required checks passed."
