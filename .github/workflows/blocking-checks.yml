# Implements: ci/checks-on-every-pr, ci/one-gate, ci/report-comment, ci/ci-runs-everything, ci/end-to-end, ci/ci-minutes
name: blocking-checks

# The one status to require before merging. Every check is a step of this one
# job: GitHub bills each job as at least a minute, so steps cost far less than
# jobs (contributing/spec/ci.md). Add new checks as steps.
on:
  pull_request:
    # edited: re-check the title and description (pr-gate) when they change.
    # No branch filter, so stacked pull requests are checked too.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer run for the same pull request (or branch) cancels the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blocking-checks:
    # Drafts wait: marking a pull request ready runs the checks.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Title and closing block (contributing/spec/pull-requests.md).
      - name: pr-gate
        run: python3 .github/scripts/pr_gate.py
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: make lint
      - run: make test
      - run: make spec-check
      # One free game, its report attached and summed up in a comment. Only
      # posting the comment may fail quietly.
      - run: uv run lab run configs/pr-game.yaml --out runs/pr --cache off -y
      - run: uv run lab report runs/pr --out runs/pr/report.html
      - run: >-
          uv run python -c "from collusion_lab.report.markdown import
          first_screen_markdown as f; print(f('runs/pr'))" > runs/pr/first-screen.md
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: runs/pr/report.html
      - run: python3 .github/scripts/report_comment.py runs/pr/first-screen.md
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
