# Implements: ci/checks-on-every-pr, ci/one-gate
name: blocking-checks

# The one status to require before merging. Add jobs below and list each in the
# gate's needs.
on:
  pull_request:
    # edited: re-check the title and description (pr-gate) when they change.
    # No branch filter, so stacked pull requests are checked too.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Title and closing block (contributing/spec/pull-requests.md).
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            product/spec
            experiments/spec
            contributing/spec
          persist-credentials: false
      - run: python3 .github/scripts/pr_gate.py

  blocking-checks:
    runs-on: ubuntu-latest
    needs: [ci, pr-gate]
    if: always()
    permissions: {}
    steps:
      - name: All required checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if ! jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"; then
            echo "A required check failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All required checks passed."
