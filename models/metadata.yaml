# Implements: backends/model-metadata
# Published facts about every model the lab has used, by model id. Each fact
# is {value, source, quote, retrieved}: the URL it was read from, the words it
# was read in, and the date. A null value means no source publishes it for the
# variant our runs play (thinking off); its note says where we looked. Never
# estimate a number here. same_as: the same model served elsewhere.
