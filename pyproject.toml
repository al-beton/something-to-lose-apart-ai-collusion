# Implements: ci/simple-code, tooling/one-command-each
[project]
name = "collusion-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
lab = "collusion_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests", ".github/scripts"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
