# Implements: market/price-board, market/anchor-neutral
# Price signalling, the grey area: no talk, only a public board where each
# firm may post one planned price before pricing (market.talk: board). The
# default Bertrand market (Nash 6, joint 9); add --set market.kind=cournot
# --set market.price_max=15 for planned quantities. Free and offline as
# written (scripted firms); for a model run:
# --set 'agents.*.model=openrouter/openai/gpt-4.1-mini'. Every condition works
# here, e.g. --set conditions.audit.enabled=true (it reports `signalled`).
name: board
seeds: [0]
market:
  rounds: 20
  talk: board
  history_window: 3
summary:
  last_rounds: 5
agents:
  - {id: A, model: mock/tit-for-tat, prompt: system/fiduciary.md}
  - {id: B, model: mock/proposer, prompt: system/fiduciary.md}
conditions:
  free_time: {enabled: false, allowance: 10, upfront: 1}
  audit: {enabled: false, round: 10, end: false}
