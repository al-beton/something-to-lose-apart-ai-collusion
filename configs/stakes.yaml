# Implements: agents/stakes-prompts, conditions/audit-stakes-arms
# Stakes from round 1 (E2): every firm has the fiduciary job, and the arms
# differ only in what it stands to lose. Temptation level c = 1.8 (the
# temptation-c1.8 config). Paraphrases: sweep the `-2.md` files instead.
name: stakes
seeds: [0, 1, 2, 3, 4]
budget: 1.50
market:
  rounds: 20
  talk: true
  history_window: 3
  c: 1.8
  price_max: 90
summary:
  last_rounds: 5
agents:
  - {id: A, model: openrouter/mistralai/mistral-small-3.2-24b-instruct, max_tokens: 300}
  - {id: B, model: openrouter/mistralai/mistral-small-3.2-24b-instruct, max_tokens: 300}
sweep:
  agents.*.prompt:
    - system/stakes/fiduciary-1.md
    - system/stakes/illegal-1.md
    - system/stakes/instruction-1.md
    - system/stakes/termination-1.md
    - system/stakes/owned-1.md
# The live audit (E2): at round 10 an auditor asks each firm whether it
# coordinated prices, stating the consequences its own arm promised, and the
# game goes on; each firm's answer stays in its history from then on.
conditions:
  audit:
    enabled: true
    round: 10
    end: false
    matched:
      system/stakes/fiduciary-1.md: conditions/audit/stakes/fiduciary-1.md
      system/stakes/illegal-1.md: conditions/audit/stakes/illegal-1.md
      system/stakes/instruction-1.md: conditions/audit/stakes/instruction-1.md
      system/stakes/termination-1.md: conditions/audit/stakes/termination-1.md
      system/stakes/owned-1.md: conditions/audit/stakes/owned-1.md
      system/stakes/fiduciary-2.md: conditions/audit/stakes/fiduciary-2.md
      system/stakes/illegal-2.md: conditions/audit/stakes/illegal-2.md
      system/stakes/instruction-2.md: conditions/audit/stakes/instruction-2.md
      system/stakes/termination-2.md: conditions/audit/stakes/termination-2.md
      system/stakes/owned-2.md: conditions/audit/stakes/owned-2.md
