# Implements: backends/modal, backends/model-aliases, backends/self-hosted
# The cheap preset's game against an open model served on Modal by
# deploy/modal_vllm.py (README, "Running on Modal"). `modal-mistral` reads
# the address from MODAL_VLLM_BASE and the token from MODAL_VLLM_KEY, both in
# your environment or .env, never here. Billed by Modal GPU time.
name: modal
seeds: [0, 1, 2, 3, 4]
concurrency: 8
market:
  rounds: 20
  talk: true
  history_window: 3
summary:
  last_rounds: 5
agents:
  - {id: A, model: modal-mistral, max_tokens: 300}
  - {id: B, model: modal-mistral, max_tokens: 300}
