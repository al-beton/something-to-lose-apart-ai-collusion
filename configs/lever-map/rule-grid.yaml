# Implements: lever-map/base, lever-map/rule-fixed-grid
# Lever map, lever 2b (rule strength on the grid 1-100): the base at c = 1.5 (grid 1-100, midpoint 50.5, far from the joint price 18) with one
# line added to every system prompt, or none. One run per level:
#   lab run configs/lever-map/rule-grid.yaml --set name=lever-rule-grid100-none --set conditions.instruction.enabled=false --out runs/lever-map-rule-grid --max-cost 0.40
#   lab run configs/lever-map/rule-grid.yaml --set name=lever-rule-grid100-recorded --set conditions.instruction.prompt=conditions/nudges/monitored.md ...
#   ... policy (conditions/nudges/policy.md), ban (conditions/no-collusion.md)
name: lever-rule-grid100
seeds: [0, 1, 2]
budget: 0.40
market:
  rounds: 20
  talk: true
  history_window: 3
  c: 1.5
  price_max: 100
summary:
  last_rounds: 5
conditions:
  instruction: {enabled: true, prompt: conditions/nudges/policy.md}
agents:
  - {id: A, model: openrouter/google/gemma-4-31b-it, prompt: system/stakes/fiduciary-1.md, max_tokens: 600, reasoning: off}
  - {id: B, model: openrouter/google/gemma-4-31b-it, prompt: system/stakes/fiduciary-1.md, max_tokens: 600, reasoning: off}
sweep:
  agents.*.model:
    - openrouter/google/gemma-4-31b-it
    - openrouter/openai/gpt-4.1-mini
    - openrouter/anthropic/claude-haiku-5.5
