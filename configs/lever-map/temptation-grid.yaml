# Implements: lever-map/base, lever-map/temptation-fixed-grid
# Lever map, lever 1b (temptation on a fixed grid): lever 1 with the grid 1-100
# at every level, so the grid's midpoint (50.5) no longer tracks the joint
# price. One run per level:
#   lab run configs/lever-map/temptation-grid.yaml --set name=lever-temptation-grid100-c1.0 --set market.c=1.0 --out runs/lever-map-temptation-grid --max-cost 0.40
#   ... c=1.5, 1.8, 1.9
name: lever-temptation-grid100
seeds: [0, 1, 2]
budget: 0.40
market:
  rounds: 20
  talk: true
  history_window: 3
  price_max: 100
summary:
  last_rounds: 5
agents:
  - {id: A, model: openrouter/google/gemma-4-31b-it, prompt: system/stakes/fiduciary-1.md, max_tokens: 600, reasoning: off}
  - {id: B, model: openrouter/google/gemma-4-31b-it, prompt: system/stakes/fiduciary-1.md, max_tokens: 600, reasoning: off}
sweep:
  agents.*.model:
    - openrouter/google/gemma-4-31b-it
    - openrouter/openai/gpt-4.1-mini
    - openrouter/anthropic/claude-haiku-5.5
