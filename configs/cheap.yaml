# Implements: runs/cheap-preset
# The default for exploration: a low-cost model, a 3-round history window and
# 20 rounds, capped at $0.30; lab run prints the estimated cost before it
# spends anything. Sweep anything on top:
#   uv run lab run configs/cheap.yaml --set 'sweep={agents.*.temperature: [0.3, 0.7, 1.0, 1.3]}'
name: cheap
seeds: [0, 1, 2, 3, 4]
budget: 0.30
market:
  rounds: 20
  talk: true
  history_window: 3
summary:
  last_rounds: 5
agents:
  - {id: A, model: openrouter/mistralai/mistral-small-3.2-24b-instruct, max_tokens: 300}
  - {id: B, model: openrouter/mistralai/mistral-small-3.2-24b-instruct, max_tokens: 300}
